name: Golden Model Regression

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/**'
      - 'backend/tests/regression/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/**'
      - 'backend/tests/regression/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: C1-C10 Golden Model Matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system CAD and OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libxrender1 \
            libxext6 \
            libsm6 \
            libice6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Golden Model Regression Suite
        run: pytest tests/regression -v --no-traceability-check

