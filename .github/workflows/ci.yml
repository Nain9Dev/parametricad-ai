name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system CAD and OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libxrender1 \
            libxext6 \
            libsm6 \
            libice6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Typecheck with Mypy
        run: mypy app tests

      - name: Run Pytest suite
        run: pytest

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint with oxlint
        run: npm run lint

      - name: Typecheck with tsc
        run: npm run typecheck

      - name: Test with Vitest
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify the PWA build
        run: npm run verify:pwa

  # Browser-level tests (ADR-0009): the production build in headless Chromium,
  # for what jsdom cannot run (service worker, offline start, update prompt,
  # layout and touch targets). It builds its own bundles, so it needs nothing
  # from the job above and runs beside it. Actions are pinned by commit SHA.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the browser tests
        run: npm run typecheck:e2e

      # The headless shell is all the suite drives. The browser is downloaded on
      # every run: Playwright advises against caching it, and the system
      # packages that --with-deps installs cannot be cached anyway.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run the browser tests
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/node_modules/.cache/parametricad-e2e/report
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
