          <rect x="6" y="6" width="330" height="70" fill="none" stroke="#000000" stroke-width="1.5" rx="6" />
          <circle cx="24" cy="35" r="5" fill="#80FF00" />
          <text x="40" y="40" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="600" fill="#FFFFFF">Zero Self-Intersections</text>
